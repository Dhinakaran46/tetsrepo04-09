<div class="color-picker-container">
  <div class="color-picker-wrapper">
    <div class="color-preview" [style.background]="hexValue">
      <input #colorInput type="color" class="color-input" [value]="hexValue" (change)="onColorChange($event)" />
    </div>
  </div>

  <div class="color-value">
    {{ formControlAsFormControl.value || 'Select a color' }}
  </div>
</div>
