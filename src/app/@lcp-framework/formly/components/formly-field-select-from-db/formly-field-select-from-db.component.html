<div class="flex items-center gap-2">
  <div class="flex-1">
    <ng-select [readonly]="to['readonly'] || false" *ngIf="to['table']" bindLabel="label" bindValue="value"
      [formControl]="formControl" [formlyAttributes]="field" [items]="options$ | async" [multiple]="to['multiple'] || false"
      [clearable]="false" placeholder="{{ to.placeholder || 'Select an option' }}" class="form-control"
      [ngClass]="{'is-invalid': formControl.invalid && (formControl.touched || formControl.dirty || field.options?.formState?.submitted)}">
    </ng-select>
    <ng-select *ngIf="!to['table']" bindLabel="label" bindValue="value" [formControl]="formControl"
      [formlyAttributes]="field" [items]="static_options$ | async" [multiple]="to['multiple'] || false" [clearable]="false"
      placeholder="{{ to.placeholder || 'Select an option' }}" class="form-control"
      [ngClass]="{'is-invalid': formControl.invalid && (formControl.touched || formControl.dirty || field.options?.formState?.submitted)}">
    </ng-select>
  </div>
  <div class="flex-none" *ngIf="getAddEditForm()">
    <button 
      type="button" 
      class="btn-primary flex items-center rounded-md border border-[#e0e6ed] px-3 py-2 font-semibold dark:border-[#253b5c] dark:bg-[#1b2e4b] dark:text-white-dark"
      (click)="openNestedFormModal(getAddEditForm() || '', getFieldKey())"
      [title]="'Add new ' + (getAddEditForm() || '')"
    >
      <i class="fa-solid fa-plus"></i>
    </button>
  </div>
</div>
