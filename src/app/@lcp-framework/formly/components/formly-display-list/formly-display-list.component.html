@if (listDatas?.length > 0) {
<div class="flex flex-wrap rounded-md border border-[#e0e6ed] dark:border-[#1b2e4b]">
  @for (item of listDatas; track item) {
  <a
    title="Click to copy"
    href="javascript:;"
    class="px-4 py-2.5 hover:bg-[#eee] dark:hover:bg-[#eee]/10 val-{{ item.value }}"
    (click)="copyContent(item.label)"
    >{{ item.label }}</a
  >
  }
</div>
}
