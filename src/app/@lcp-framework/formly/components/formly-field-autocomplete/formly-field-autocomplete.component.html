<ng-select bindLabel="label" bindValue="value" [formControl]="formControl" [formlyAttributes]="field"
  [items]="options$ | async" [multiple]="to['multiple'] || false" [clearable]="true" [searchable]="true"
  placeholder="{{ to.placeholder || 'Select an option' }}" class="custom-multiselect" [typeahead]="searchSubject">
</ng-select>
