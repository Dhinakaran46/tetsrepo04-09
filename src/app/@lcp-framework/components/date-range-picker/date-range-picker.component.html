<div class="date-range-picker w-full rounded-lg bg-white p-4 dark:bg-gray-800">
  <div class="flex w-full items-end justify-between gap-3">
    <!-- Quick date range selector -->
    <div class="w-56 flex-shrink-0">
      <label class="mb-1 text-primary">
        {{ 'select_date' | translate }}
      </label>
      <select
        [ngModel]="selectedQuickRange"
        (ngModelChange)="onQuickDateSelect($event)"
        class="w-full rounded-md border border-gray-300 bg-white py-2 pl-3 pr-8 text-sm text-gray-700 shadow-sm transition-colors focus:border-blue-500 focus:ring-2 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-200"
      >
        <option [ngValue]="''" disabled>Select range</option>
        <option [value]="'today'">Today</option>
        <option [value]="'yesterday'">Yesterday</option>
        <option [value]="'thisWeek'">This Week</option>
        <option [value]="'lastWeek'">Last Week</option>
        <option [value]="'thisMonth'">This Month</option>
        <option [value]="'lastMonth'">Last Month</option>
        <option [value]="'last3Months'">Last 3 Months</option>
        <option [value]="'last6Months'">Last 6 Months</option>
        <option [value]="'thisYear'">This Year</option>
        <option [value]="'defaultDate'">Default Date</option>
      </select>
    </div>

    <!-- From Date -->
    <div class="w-40 flex-shrink-0">
      <label class="mb-1 text-primary">
        {{ 'from_date' | translate }}
      </label>
      <input
        #fromDateInput
        type="text"
        appFlatpickr="date"
        [value]="pendingDateRange.fromDate ? formatDateForInput(pendingDateRange.fromDate) : ''"
        [appFlatpickrMaxDate]="pendingDateRange.toDate ? formatDateForInput(pendingDateRange.toDate) : maxDate"
        (change)="onFromDateChange($event)"
        class="w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-gray-900 transition-colors focus:border-blue-500 focus:ring-2 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white"
      />
    </div>

    <!-- To Date -->
    <div class="w-40 flex-shrink-0">
      <label class="mb-1 text-primary">
        {{ 'to_date' | translate }}
      </label>
      <input
        #toDateInput
        type="text"
        appFlatpickr="date"
        [value]="pendingDateRange.toDate ? formatDateForInput(pendingDateRange.toDate) : ''"
        [appFlatpickrMinDate]="pendingDateRange.fromDate ? formatDateForInput(pendingDateRange.fromDate) : minToDate"
        [appFlatpickrMaxDate]="maxDate"
        [disabled]="!pendingDateRange.fromDate"
        (change)="onToDateChange($event)"
        class="w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-gray-900 transition-colors focus:border-blue-500 focus:ring-2 focus:ring-blue-500 disabled:opacity-50 dark:border-gray-600 dark:bg-gray-700 dark:text-white"
      />
    </div>

    <!-- Buttons -->
    <div class="flex flex-shrink-0 items-end gap-2">
      <button type="button" (click)="onSubmit()" [disabled]="!pendingDateRange.fromDate || !pendingDateRange.toDate" class="btn btn-primary px-4 py-2">
        <span class="flex items-center">
          {{ 'apply' | translate }}
        </span>
      </button>
      <button type="button" (click)="clearQuickRange()" class="btn btn-danger px-4 py-2">
        <span class="flex items-center">
          {{ 'reset' | translate }}
        </span>
      </button>
    </div>
  </div>
</div>
