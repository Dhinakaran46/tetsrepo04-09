<div>
  <div class="panel">
    <div class="mb-5 flex flex-col items-start justify-between gap-3 lg:flex-row lg:items-center">
      <h5 class="text-lg font-semibold dark:text-white-light">
        {{ 'policy_add_edit_form' | translate }}
      </h5>
    </div>
    <div class="mb-5 w-full space-y-5 dark:text-white">
      <div class="rounded-md border-2 border-dashed border-gray-300 p-4 dark:text-white md:col-span-2 lg:col-span-3">
        <form [formGroup]="policyForm" class="space-y-6">
          <div>
            <div class="grid grid-cols-1 gap-6 lg:grid-cols-1">
              <div class="mb-5 grid grid-cols-1 gap-6 lg:grid-cols-3">
                <div class="flex flex-col">
                  <label for="policy_name">{{ 'policy_name' | translate }} <span class="text-danger">*</span></label>
                  <input
                    autocomplete="off"
                    appDynamicFontSize="body"
                    formControlName="policy_name"
                    id="policy_name"
                    type="text"
                    class="form-input w-full py-1 text-xs text-gray-600 placeholder:text-white-dark"
                    [required]="true"
                  />
                  <div
                    *ngIf="policyForm.get('policy_name')?.invalid && (policyForm.get('policy_name')?.touched || policyForm.get('policy_name')?.dirty)"
                    class="invalid-feedback mt-1 text-danger"
                  >
                    {{ 'policy_name_is_required' | translate }}
                  </div>
                </div>
                <div class="flex flex-col">
                  <label for="policy_description">{{ 'policy_description' | translate }}</label>
                  <input
                    autocomplete="off"
                    appDynamicFontSize="body"
                    formControlName="policy_description"
                    id="policy_description"
                    type="text"
                    class="form-input w-full py-1 text-xs text-gray-600 placeholder:text-white-dark"
                    [required]="true"
                  />
                </div>
                <div class="align-center inline-contents relative justify-center" *ngIf="!unique_id">
                  <label for="entity_id">{{ 'entity_name' | translate }} <span class="text-danger">*</span></label>
                  <select
                    appDynamicFontSize="body"
                    id="entity_id"
                    class="form-select w-full py-1 text-xs text-gray-700 placeholder:text-white-dark dark:bg-gray-800 dark:text-white-dark"
                    formControlName="entity_id"
                    (change)="getEntityData()"
                    [required]="true"
                  >
                    <option value>{{ 'Select the entity' }}</option>
                    <option *ngFor="let entity of entityList" [value]="entity.value">{{ entity.label | translate }}</option>
                  </select>
                  <div
                    *ngIf="policyForm.get('entity_id')?.invalid && (policyForm.get('entity_id')?.touched || policyForm.get('entity_id')?.dirty)"
                    class="invalid-feedback mt-1 text-danger"
                  >
                    {{ 'entity_is_required' | translate }}
                  </div>
                </div>
                <div class="flex flex-col" *ngIf="unique_id">
                  <label for="entity_name">{{ 'entity_name' | translate }} <span class="text-danger">*</span></label>
                  <input
                    autocomplete="off"
                    appDynamicFontSize="body"
                    formControlName="entity_name"
                    id="entity_name"
                    type="text"
                    readonly
                    class="form-input w-full py-1 text-xs text-gray-600 placeholder:text-white-dark"
                    [required]="true"
                  />
                </div>
              </div>
            </div>
            <div class="grid grid-cols-1 gap-6 lg:grid-cols-1">
              <div class="mb-5 grid grid-cols-1 gap-6 lg:grid-cols-3">
                <div class="flex flex-col">
                  <label for="operator" class="required-mark mb-2 block font-medium">{{ 'operator' | translate }}</label>
                  <div class="flex items-center space-x-4">
                    <label class="flex cursor-pointer items-center">
                      <input type="radio" [value]="'AND'" formControlName="operator" class="form-radio" appDynamicFontSize="body" />
                      <span class="ml-2 text-white-dark">{{ 'and' | translate }}</span>
                    </label>

                    <label class="flex cursor-pointer items-center">
                      <input type="radio" [value]="'OR'" formControlName="operator" class="form-radio" appDynamicFontSize="body" />
                      <span class="ml-2 text-white-dark">{{ 'or' | translate }}</span>
                    </label>
                  </div>
                </div>
                <div class="flex flex-col">
                  <label for="status_id" class="required-mark mb-2 block font-medium">{{ 'form_label_status' | translate }}</label>
                  <div class="flex items-center space-x-4">
                    <label class="flex cursor-pointer items-center">
                      <input type="radio" [value]="1" formControlName="status_id" class="form-radio" appDynamicFontSize="body" />
                      <span class="ml-2 text-white-dark">{{ 'table_status_val_0' | translate }}</span>
                    </label>

                    <label class="flex cursor-pointer items-center">
                      <input type="radio" [value]="2" formControlName="status_id" class="form-radio" appDynamicFontSize="body" />
                      <span class="ml-2 text-white-dark">{{ 'table_status_val_1' | translate }}</span>
                    </label>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
    <div class="mb-5 w-full space-y-5 dark:text-white">
      <div class="rounded-md border-2 border-dashed border-gray-300 p-4 dark:text-white md:col-span-2 lg:col-span-3">
        <div class="flex flex-col justify-between gap-5 sm:flex-row">
          <div appDynamicFontSize="title" class="font-semibold">{{ 'policy_conditions' | translate }}</div>
          <div class="xs:w-full">
            <button
              type="button"
              (click)="addCondition()"
              class="btn-primary flex items-center rounded-md border border-[#e0e6ed] px-4 py-2 font-semibold dark:border-[#253b5c] dark:bg-[#1b2e4b] dark:text-white-dark"
            >
              <i class="fa-solid fa-plus"></i>&nbsp;Add New
            </button>
          </div>
        </div>
        <div>
          <div class="space-y-2 p-4">
            <div class="flex flex-col gap-3">
              <div *ngFor="let condition of filterConditions; let i = index" class="flex items-center gap-2">
                <select (change)="onColumnChange($event, i)" [(ngModel)]="condition.field" appDynamicFontSize="body" class="form-select w-full">
                  <option appDynamicFontSize="body" value selected disabled>{{ 'table_multiselect_1' | translate }}</option>
                  <option appDynamicFontSize="body" *ngFor="let col of filteredColumns" [value]="col.field">{{ col.title }}</option>
                </select>
                <select appDynamicFontSize="body" [(ngModel)]="condition.operator" class="form-select w-full">
                  <option appDynamicFontSize="body" value selected disabled>{{ 'condition' | translate }}</option>
                  <option appDynamicFontSize="body" *ngFor="let op of getOperatorsForColumn(condition.field)" [value]="op.value">{{ op.label }}</option>
                </select>
                <input
                  [ngModel]="getConditionValue(i)"
                  (ngModelChange)="setConditionValue(i, $event)"
                  [type]="getInputTypeForColumn(condition.field)"
                  class="form-input w-full pr-10 text-gray-600"
                  [placeholder]="getPlaceholderForColumn(condition.field)"
                  [attr.min]="getMinValueForColumn(condition.field)"
                  [attr.max]="getMaxValueForColumn(condition.field)"
                  [attr.pattern]="getPatternForColumn(condition.field)"
                  [required]="true"
                  appDynamicFontSize="body"
                />
                <button (click)="removeCondition(i)" class="text-red-500">
                  <i class="fa-solid fa-xmark text-xl"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="flex flex-row justify-end gap-4 py-4">
      <button
        class="hover:bg-primary-dark dark:bg-primary-dark dark:focus:ring-primary-dark flex w-40 flex-row items-center justify-center gap-8 rounded-md bg-primary px-6 py-2 text-white shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 dark:text-white"
        type="button"
        [disabled]="policyForm.invalid ? true : false"
        (click)="toggleDropdown()"
      >
        Submit
        <svg class="-mr-1 ml-2 h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path
            fill-rule="evenodd"
            d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.71a.75.75 0 111.06 1.06l-4 4a.75.75 0 01-1.06 0l-4-4a.75.75 0 01.02-1.06z"
            clip-rule="evenodd"
          />
        </svg>
      </button>

      <div
        class="top-15 absolute bottom-16 right-5 mb-0.5 mt-2 w-40 max-w-sm origin-bottom-right rounded-md bg-white shadow-lg ring-1 ring-black ring-opacity-5 focus:outline-none"
        *ngIf="dropdownOpen"
      >
        <div class="py-1" role="menu" aria-orientation="vertical" aria-labelledby="options-menu">
          <button
            type="submit"
            (click)="onOptionSelect(); upsertPolicy()"
            class="block w-full px-4 py-2 text-left text-gray-700 hover:bg-gray-100"
            role="menuitem"
          >
            Submit
          </button>
          <button
            type="submit"
            (click)="onOptionSelect(); upsertPolicy(true)"
            class="block w-full px-4 py-2 text-left text-gray-700 hover:bg-gray-100"
            role="menuitem"
          >
            Submit and Close
          </button>
          <button
            type="button"
            (click)="onOptionSelect(); location.back()"
            class="block w-full px-4 py-2 text-left text-gray-700 hover:bg-gray-100"
            role="menuitem"
          >
            Close
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<app-loader *ngIf="loading"></app-loader>
