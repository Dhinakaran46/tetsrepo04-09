<div class="h-full flex flex-col p-4 space-y-4">
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-100">{{ pageInfo?.title | translate }}</h1>
    <button
      *ngIf="permissions.create"
      (click)="onAddRoot()"
      class="btn btn-primary flex items-center space-x-2"
    >
      <i class="fa-solid fa-plus"></i>
      <span>{{ 'add_root_node' | translate }}</span>
    </button>
  </div>

  <div class="flex-grow grid grid-cols-1 md:grid-cols-3 gap-6 overflow-hidden">
    <!-- Left Pane: Tree View -->
    <div class="md:col-span-1 bg-white dark:bg-gray-900 rounded-lg shadow-sm border border-gray-200 dark:border-gray-800 flex flex-col overflow-hidden">
      <div class="p-3 border-b border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-800 flex items-center">
        <i class="fa-solid fa-sitemap mr-2 text-primary"></i>
        <span class="font-semibold text-sm uppercase tracking-wider text-gray-500">{{ 'tree_structure' | translate }}</span>
      </div>
      
      <div class="flex-grow overflow-y-auto p-4">
        <ul *ngIf="treeData.length > 0; else noData">
          <app-tree-view-item
            *ngFor="let item of treeData"
            [item]="item"
            [treeview]="treeview"
            [permissions]="permissions"
            [selectedNodeUuid]="selectedNode?.uuid"
            (selectNode)="onNodeSelected($event)"
            (deleteNode)="onDeleteNode($event)"
            (addChild)="onAddChild($event)"
          ></app-tree-view-item>
        </ul>
        <ng-template #noData>
          <div class="flex flex-col items-center justify-center h-40 text-gray-400">
            <i class="fa-solid fa-folder-open text-3xl mb-2"></i>
            <p>{{ 'no_nodes_found' | translate }}</p>
          </div>
        </ng-template>
      </div>
    </div>

    <!-- Right Pane: Form Builder -->
    <div class="md:col-span-2 bg-white dark:bg-gray-900 rounded-lg shadow-sm border border-gray-200 dark:border-gray-800 flex flex-col overflow-hidden">
      <div *ngIf="showForm; else selectPlaceholder" class="h-full flex flex-col">
        <div class="p-3 border-b border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-800 flex items-center justify-between">
          <div class="flex items-center">
            <i class="fa-solid fa-edit mr-2 text-primary" [class.fa-plus]="formType === 'add'"></i>
            <span class="font-semibold text-sm uppercase tracking-wider text-gray-500">
              {{ (formType === 'add' ? 'add_node' : 'edit_node') | translate }}
              <span *ngIf="selectedNode" class="ml-1 text-gray-400 font-normal"> - {{ selectedNode.name }}</span>
            </span>
          </div>
          <button (click)="showForm = false" class="text-gray-400 hover:text-danger">
            <i class="fa-solid fa-times"></i>
          </button>
        </div>
        
        <div class="flex-grow overflow-y-auto p-6">
          <app-form-builder
            [entityName]="formEntityName"
            [entityType]="formEntityType"
            [uuid]="formUuid"
            [defaultData]="formDefaultData"
            (onSuccess)="onFormSuccess($event)"
          ></app-form-builder>
        </div>
      </div>

      <ng-template #selectPlaceholder>
        <div class="flex flex-col items-center justify-center h-full text-gray-400 p-10 text-center">
          <i class="fa-solid fa-i-cursor text-5xl mb-4 opacity-20"></i>
          <h3 class="text-lg font-medium text-gray-600 dark:text-gray-400 mb-2">{{ 'select_a_node_to_edit' | translate }}</h3>
          <p class="max-w-xs">{{ 'select_node_instruction' | translate }}</p>
          <button
             *ngIf="permissions.create"
             (click)="onAddRoot()"
             class="mt-6 text-primary hover:underline font-medium"
          >
            {{ 'or_create_a_new_root_node' | translate }}
          </button>
        </div>
      </ng-template>
    </div>
  </div>
</div>
