<div class="space-y-6">

  <!-- 🔹 Tabs -->
  <div class="flex border-b border-gray-200">
    <button class="px-6 py-2 font-semibold transition"
      [ngClass]="section === 'import' ? 'border-b-2 border-primary text-primary' : 'text-gray-500'"
      (click)="section = 'import'">
      Import
    </button>

    <button class="px-6 py-2 font-semibold transition"
      [ngClass]="section === 'export' ? 'border-b-2 border-primary text-primary' : 'text-gray-500'"
      (click)="section = 'export'">
      Export
    </button>
  </div>

  <!-- 🔹 Loader -->
  <div *ngIf="isLoading" class="loader-overlay">
    <div class="w-full max-w-md text-center">
      <p *ngIf="progress > 0 && progress < 100" class="mb-2 font-semibold">
        Processing... {{ progress }}%
      </p>

      <div *ngIf="progress > 0 && progress < 100" class="h-4 w-full rounded bg-gray-200">
        <div class="h-4 rounded bg-primary" [style.width]="progress + '%'"></div>
      </div>

      <div *ngIf="progress === 0 || progress === 100" class="spinner mt-4"></div>
    </div>
  </div>

  <!-- 🔹 Export -->
  <div *ngIf="section === 'export'" class="panel p-5 rounded-lg shadow-sm bg-white">

    <h2 class="mb-5 text-lg font-bold border-b pb-2">
      Export Master Entity
    </h2>

    <form [formGroup]="exportForm">

      <!-- Type + Company -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

        <div>
          <label class="block mb-1 font-medium">Type</label>
          <select formControlName="type" class="form-select w-full">
            <option value="update">Update</option>
            <option value="replace">Replace</option>
          </select>
        </div>

        <div>
          <!-- <label class="block mb-1 font-medium">Company</label>
          <input type="number" formControlName="companyId" class="form-input w-full" /> -->
        </div>

      </div>

      <!-- Divider -->
      <div class="my-6 border-t"></div>

      <!-- Dynamic Checkbox Section -->
      <div>
        <div class="flex items-center justify-between mb-4">
          <label class="block font-semibold text-gray-700">
            Select Modules to Export
          </label>
          <div class="flex gap-3">
            <button type="button" class="px-3 py-1 text-sm font-medium btn btn-outline-primary transition"
              (click)="toggleAll(true)">
              Select All
            </button>
            <button type="button" class="px-3 py-1 text-sm font-medium btn btn-outline-primary transition"
              (click)="toggleAll(false)">
              Clear
            </button>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          <div *ngFor="let item of checkboxOptions"
            class="border rounded-lg overflow-hidden hover:shadow-md transition-shadow"
            [class.cursor-pointer]="!expandedItems[item.control]"
            (click)="!expandedItems[item.control] && toggleCheckbox(item.control)">

            <!-- Header -->
            <div class="flex items-start gap-3 p-4 hover:bg-gray-50 transition">
              <input type="checkbox" [formControlName]="item.control"
                class="form-checkbox h-4 w-4 text-blue-600 mt-1 pointer-events-none" />

              <div class="flex-1">
                <span class="text-sm font-semibold text-gray-800 block">
                  {{ item.label }}
                </span>
                <span *ngIf="item.description" class="text-xs text-gray-500 mt-1 block">
                  {{ item.description }}
                </span>

                <!-- Expand/Collapse Button - Separate click handler -->
                <div class="flex items-center gap-2 mt-2 expand-button" (click)="toggleExpand(item.control, $event)">
                  <span class="text-xs text-gray-400">
                    {{ item.tables?.length || 0 }} tables
                  </span>
                  <span class="text-xs text-gray-400">
                    <i class="fas" [class.fa-chevron-down]="expandedItems[item.control]"
                      [class.fa-chevron-right]="!expandedItems[item.control]"></i>
                  </span>
                </div>
              </div>
            </div>

            <!-- Expanded Content -->
            <div *ngIf="expandedItems[item.control]" class="border-t bg-gray-50 p-3 max-h-48 overflow-y-auto">
              <div class="grid grid-cols-1 gap-1">
                <div *ngFor="let table of item.tables"
                  class="text-xs text-gray-600 py-1 px-2 rounded hover:bg-gray-100">
                  {{ table }}
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Action -->
      <div class="mt-6 flex items-center gap-3">

        <button type="button" (click)="exportData()" [disabled]="isLoading"
          class="btn btn-primary px-5 py-2 flex items-center gap-2">

          <span *ngIf="!isLoading">⬇ Export</span>
          <span *ngIf="isLoading">Exporting...</span>

        </button>

      </div>

    </form>
  </div>

  <!-- 🔹 Import -->
  <div *ngIf="section === 'import'" class="panel">

    <h2 class="mb-4 text-lg font-bold">Import Master Entity</h2>

    <form [formGroup]="importForm">

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">

        <div>
          <label class="mb-1 block">Upload ZIP File</label>
          <input type="file" (change)="onFileChange($event)" class="form-input" accept=".zip" #fileInput />
        </div>

      </div>

      <!-- Selected file preview -->
      <div *ngIf="file" class="mt-3 text-sm text-gray-600">
        Selected: <span class="font-semibold">{{ file.name }}</span>
      </div>

      <div class="mt-6 flex items-center gap-3">
        <button type="button" (click)="importData()" [disabled]="isLoading" class="btn btn-primary">
          ⬆ Import
        </button>
      </div>

    </form>

    <!-- ✅ Success message -->
    <div *ngIf="!isLoading && progress === 100" class="mt-6 rounded bg-green-100 p-4 text-green-700">
      ✅ Import completed successfully
    </div>

  </div>

</div>
