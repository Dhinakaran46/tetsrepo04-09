<div style="height: 100%;" class="login-app">
    <div class="absolute inset-0">
        <img src="assets/images/auth/bg-gradient.png" alt="image"
            class="h-full w-full object-cover" />
    </div>
    <div style="height: 100%;"
        class="relative flex min-h-96 items-center justify-center bg-[url(../../assets/images/auth/map.png)] bg-cover bg-center bg-no-repeat px-6 py-10 dark:bg-[#060818] sm:px-16">
        <img src="assets/images/auth/coming-soon-object1.png" alt="image"
            class="absolute left-0 top-1/2 h-full max-h-[893px] -translate-y-1/2" />
        <img src="assets/images/auth/coming-soon-object2.png" alt="image"
            class="absolute left-24 top-0 h-40 md:left-[30%]" />
        <img src="assets/images/auth/coming-soon-object3.png" alt="image"
            class="absolute right-0 top-0 h-[300px]" />
        <img src="assets/images/auth/polygon-object.svg" alt="image"
            class="absolute bottom-0 end-[28%]" />
        <div
            class="relative flex w-full max-w-[1502px] flex-col justify-between overflow-hidden rounded-md bg-white/60 backdrop-blur-lg dark:bg-black/50 lg:min-h-[100%] lg:flex-row lg:gap-10 xl:gap-0">
            <div
                class="relative hidden w-full items-center justify-center bg-[linear-gradient(225deg,rgba(239,18,98,1)_0%,rgba(67,97,238,1)_100%)] p-5 lg:inline-flex lg:max-w-[835px] xl:-ms-28 ltr:xl:skew-x-[14deg] rtl:xl:skew-x-[-14deg]">
                <div
                    class="absolute inset-y-0 w-8 from-primary/10 via-transparent to-transparent xl:w-16 ltr:-right-10 ltr:bg-gradient-to-r ltr:xl:-right-20 rtl:-left-10 rtl:bg-gradient-to-l rtl:xl:-left-20">
                </div>
                <div class="ltr:xl:-skew-x-[14deg] rtl:xl:skew-x-[14deg]">
                    <a routerLink="/" class="mt-5 ms-10 block w-48 lg:w-72">
                        <img src="assets/images/auth/logo-white.svg" alt="Logo"
                            class="w-full" />
                    </a>
                    <div class="mt-5 hidden w-full max-w-[430px] lg:block">
                        <img src="assets/images/auth/login.svg"
                            alt="Cover Image"
                            class="w-full" />
                    </div>
                </div>
            </div>
            <div
                class="relative flex w-full flex-col items-center justify-center gap-6 px-4 pb-16 pt-6 sm:px-6 lg:max-w-[667px]">
                <div
                    class="flex w-full max-w-[440px] items-center gap-2 lg:absolute lg:end-6 lg:top-6 lg:max-w-full">
                    <a routerLink="/" class="block w-8 lg:hidden">
                        <img src="assets/images/logo.svg" alt="Logo"
                            class="mx-auto w-10" />
                    </a>
                    <div class="dropdown ms-auto w-max">
                        <div hlMenu>
                            <button type="button" hlMenuButton
                                class="flex items-center gap-2.5 rounded-lg border border-white-dark/30 bg-white px-2 py-1.5 text-white-dark hover:border-primary hover:text-primary dark:bg-black">
                                <div>
                                    <img
                                        [src]="'assets/images/flags/' + store.locale.toUpperCase() + '.svg'"
                                        alt="image"
                                        class="h-5 w-5 rounded-full object-cover" />
                                </div>
                                <div class="text-base font-bold uppercase">{{
                                    store.locale
                                    }}</div>
                                <span class="shrink-0">
                                    <i class="fa-solid fa-angle-down"></i>
                                </span>
                            </button>
                            <ul *hlMenuItems @toggleAnimation
                                class="top-11 grid w-[280px] grid-cols-2 gap-2 !px-2 font-semibold text-dark dark:text-white-dark dark:text-white-light/90 ltr:-right-14 sm:ltr:-right-2 rtl:-left-14 sm:rtl:-left-2">
                                <li *ngFor="let item of store.languageList">
                                    <button *hlMenuItem="let menuItem"
                                        type="button"
                                        class="w-full hover:text-primary"
                                        [ngClass]="{ 'bg-primary/10 text-primary': translate.currentLang === item.code }"
                                        (click)="changeLanguage(item)">
                                        <img
                                            class="h-5 w-5 rounded-full object-cover"
                                            [src]="'assets/images/flags/' + item.code.toUpperCase() + '.svg'"
                                            alt />
                                        <span class="ltr:ml-3 rtl:mr-3">{{
                                            item.name }}</span>
                                    </button>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="w-full max-w-[440px] lg:mt-12">
                    <div class="mb-10">
                        <h1
                            class="text-3xl font-extrabold uppercase !leading-snug text-primary md:text-4xl">{{
                            'title_forget_password' | translate }}</h1>
                        <p
                            class="text-base font-bold leading-normal text-white-dark">{{
                            'description_forget_password' | translate }}</p>
                    </div>
                    <form class="space-y-5 dark:text-white" [formGroup]="fgForm"
                        (ngSubmit)="onSubmit()"
                        autocomplete="off">
                        <div>
                            <label for="Email">{{ 'form_label_email'
                                | translate
                                }}</label>
                            <div class="relative text-white-dark">
                                <input
                                    autocomplete="off"
                                    formControlName="email"
                                    id="Email"
                                    type="email"
                                    placeholder="{{'form_label_email_placeholder'|translate}}"
                                    class="form-input ps-10 placeholder:text-white-dark"
                                    [class.is-invalid]="isSubmitted && fgForm.controls['email'].invalid" />
                                <span
                                    class="absolute start-4 top-1/2 -translate-y-1/2">
                                    <i class="fa-solid fa-envelope"></i> </span>
                            </div>
                            <div
                                *ngIf="isSubmitted && fgForm.controls['email'].hasError('pattern')"
                                class="text-danger">
                                {{ 'form_email_valid_msg' |
                                translate }}
                            </div>

                            <div
                                *ngIf="isSubmitted && fgForm.controls['email'].hasError('required')"
                                class="text-danger">{{
                                'form_email_req_msg' | translate
                                }}</div>
                            <div
                                *ngIf="isSubmitted && fgForm.controls['email'].hasError('email')"
                                class="text-danger">{{
                                'form_email_valid_msg' |
                                translate
                                }}</div>

                        </div>

                        <button type="submit"
                            class="btn btn-gradient !mt-6 w-full border-0 uppercase shadow-[0_10px_20px_-10px_rgba(67,97,238,0.44)]">
                            {{ 'submit' | translate }}
                        </button>
                        <div class="text-center">
                            <span
                                class="text-white-dark hover:text-blue-500">&lt;</span>
                            <a
                                routerLink="/login"
                                class="text-white-dark hover:text-blue-500">
                                {{ 'login_link' | translate }}
                            </a>
                        </div>
                    </form>
                </div>
                <app-copyright
                    class="absolute bottom-10 w-full text-center dark:text-white"></app-copyright>
            </div>
        </div>
    </div>
</div>

<app-loader *ngIf="loading"></app-loader>
