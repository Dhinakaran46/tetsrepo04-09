<div class="space-y-8">
  <div class="grid grid-cols-1 gap-6 lg:grid-cols-1">
    <div class="panel">
      <div class="mb-5 flex items-center justify-between">
        <h5 class="text-lg font-semibold dark:text-white-light">{{ formEntity?.entity_name | translate }}</h5>
        <button
          *ngIf="!this.entityName"
          type="button"
          class="btn-danger rounded-md border border-[#e0e6ed] px-4 py-2 font-semibold ltr:rounded-r rtl:rounded-l"
          (click)="location.back()"
        >
          {{ 'back' | translate }}
        </button>

        <!--<button *ngIf="this.entityName && isModal" (click)="closeModal.emit()" class="btn rounded-md p-2  focus:outline-none focus:ring-2 focus:ring-blue-500 btn-danger">
          <i class="fa-solid fa-xmark"></i>
        </button>-->
      </div>
      <div class="mb-5">
        <form [formGroup]="form" (ngSubmit)="onSubmit(false)" novalidate>
          <div class="mb-5 flex flex-wrap items-center justify-end gap-2">
            <span
              class="badge badge-outline-secondary"
              *ngIf="isDrafted"
              [ngClass]="[store.fontsize === 'large' ? 'text-base' : store.fontsize === 'medium' ? 'text-sm' : 'text-xs']"
            >
              {{ 'draft' | translate }}
            </span>
            <span
              class="badge"
              [ngClass]="[
                store.fontsize === 'large' ? 'text-base' : store.fontsize === 'medium' ? 'text-sm' : 'text-xs',
                processStatuses[processStatus]?.border_color
              ]"
              *ngIf="processStatus && processStatus != 'submitted'"
            >
              {{ processStatuses[processStatus].value | translate }}
            </span>
          </div>
          <formly-form [form]="form" [fields]="fields" [options]="options" [model]="model"></formly-form>
          <div class="flex flex-wrap justify-center gap-5">
            <button
              type="button"
              class="btn-primary flex items-center rounded-md border border-[#e0e6ed] px-4 py-2 font-semibold dark:border-[#253b5c] dark:bg-[#1b2e4b] dark:text-white-dark"
              *ngIf="entity_type !== 'details' && draftMode"
              [disabled]="isDisabled"
              (click)="onSubmit(true)"
            >
              {{ 'save_as_draft' | translate }}
            </button>
            <button
              type="submit"
              class="btn-primary flex items-center rounded-md border border-[#e0e6ed] px-4 py-2 font-semibold dark:border-[#253b5c] dark:bg-[#1b2e4b] dark:text-white-dark"
              *ngIf="entity_type !== 'details'"
              [disabled]="isDisabled"
            >
              {{ 'submit' | translate }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Nested Form Builder Modal -->
<div
  class="fixed inset-0 z-50 overflow-y-auto"
  *ngIf="nestedFormModalConfig?.open"
>
  <!-- Modal Backdrop -->
  <div class="fixed inset-0 bg-black/50 transition-opacity dark:bg-black/70"></div>

  <!-- Modal Content -->
  <div class="flex min-h-screen items-center justify-center p-4">
    <div
      class="relative w-full max-w-5xl transform overflow-visible rounded-lg bg-white shadow-xl transition-all dark:border dark:border-gray-700 dark:bg-gray-800"
      [ngStyle]="{ width: nestedFormModalConfig?.width, height: nestedFormModalConfig?.height }"
    >
      <!-- Modal Title -->
      <div *ngIf="nestedFormModalConfig?.title" class="p-4 border-b">
        <h3 class="text-lg font-semibold">{{ nestedFormModalConfig.title }}</h3>
      </div>
      <!-- Corner Close Button -->
      <button
        *ngIf="nestedFormModalConfig?.showClose !== false"
        type="button"
        class="btn-xs absolute -top-5 -right-5 z-20 rounded-full bg-white shadow-lg border border-gray-200 w-8 h-8 flex items-center justify-center text-gray-500 hover:text-gray-700 hover:bg-gray-100 focus:outline-none"
        (click)="nestedFormModalConfig.open = false; noNestedFormPermission = false"
      >
        <span class="sr-only">Close</span>
        <i class="fa-solid fa-xmark text-2xl"></i>
      </button>
      <!-- Modal Body -->
      <div class="max-h-[80vh] overflow-y-auto p-4">
        <div *ngIf="noNestedFormPermission" class="flex flex-col items-center justify-center min-h-[200px]">
          <span class="text-lg text-red-600 font-semibold mb-4">No permission to view the details</span>
          <button class="btn btn-primary" (click)="nestedFormModalConfig.open = false; noNestedFormPermission = false">Close</button>
        </div>
        <ng-container *ngIf="!noNestedFormPermission">
          <app-form-builder
            *ngIf="nestedFormEntityName"
            [uuid]="nestedFormUuid"
            [entityName]="nestedFormEntityName"
            [isModal]="true"
            [isNested]="true"
            [fieldKey]="nestedFormFieldKey"
            (closeModal)="onNestedFormSubmitted($event)"
            (nestedFormSuccess)="onNestedFormSuccess($event)"
          ></app-form-builder>
        </ng-container>
      </div>
    </div>
  </div>
</div>
