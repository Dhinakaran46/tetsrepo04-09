<div>
  <app-datatable
    [loading]="gridloading"
    [masterInfo]="masterInfo"
    [enableCheckBox]="enableCheckBox"
    [customTemplates]="customTemplates"
    [headercolumns]="headercolumns"
    [selectcolumns]="selectcolumns"
    [items]="items"
    [totalItems]="totalItems"
    [currentPage]="currentPage"
    [resultsPerPage]="resultsPerPage"
    [column]="column"
    [title]="title"
    [query]="query"
    (delete)="deleteItems($event)"
    (edit)="editItem($event)"
    (view)="viewItem($event)"
    (customAction)="handleCustomAction($event)"
    (pageChange)="onPageChange($event)"
    (resultsPerPageChange)="onResultsPerPageChange($event)"
    (columnSort)="sortColumn($event)"
    (searchQuery)="searchData($event)"
    (exportType)="exportTable($event)"
    (advancedSearchQuery)="advancedSearchData($event)"
  ></app-datatable>
  <ng-template #actionTemplate let-item>
    <div class="flex items-center gap-4">
      <a
        href="javascript:void(0);"
        class="hover:text-primary"
        *ngIf="this.masterInfo.permissions.details"
        (click)="this.viewItem(item)"
        ngxTippy
        data-tippy-content="Details"
        appDynamicFontSize="body"
      >
        <i class="fa-regular fa-eye {{ store.fontsize === 'large' ? 'h-5.5 w-5.5' : store.fontsize === 'medium' ? 'h-4.5 w-4.5' : 'h-3.5 w-3.5' }}"></i>
      </a>
      <a
        href="javascript:void(0);"
        class="hover:text-info"
        appDynamicFontSize="body"
        *ngIf="
          this.masterInfo.permissions.edit &&
          (this.masterInfo?.Listname == 'mrn_grid'
            ? item?.mrn_status != 'completed'
            : true && this.masterInfo?.Listname == 'min_grid'
            ? item?.min_status != 'completed'
            : true)
        "
        (click)="this.editItem(item)"
        ngxTippy
        data-tippy-content="Edit"
      >
        <i
          class="fa-regular fa-pen-to-square {{ store.fontsize === 'large' ? 'h-5.5 w-5.5' : store.fontsize === 'medium' ? 'h-4.5 w-4.5' : 'h-3.5 w-3.5' }}"
        ></i>
      </a>

      <a
        href="javascript:void(0);"
        class="hover:text-primary"
        appDynamicFontSize="body"
        *ngIf="this.masterInfo.permissions.delete"
        (click)="this.deleteItem(item)"
        ngxTippy
        data-tippy-content="Delete"
      >
        <i class="fa-regular fa-trash-can {{ store.fontsize === 'large' ? 'h-5.5 w-5.5' : store.fontsize === 'medium' ? 'h-4.5 w-4.5' : 'h-3.5 w-3.5' }}"></i>
      </a>

      <a
        href="javascript:void(0);"
        class="hover:text-primary"
        appDynamicFontSize="body"
        *ngIf="this.masterInfo.permissions.assign"
        (click)="this.assignItem(item)"
        ngxTippy
        data-tippy-content="Assign"
      >
        <i class="fa fa-tasks {{ store.fontsize === 'large' ? 'h-5.5 w-5.5' : store.fontsize === 'medium' ? 'h-4.5 w-4.5' : 'h-3.5 w-3.5' }}"></i>
      </a>
      <a
        href="javascript:void(0);"
        class="hover:text-primary"
        appDynamicFontSize="body"
        *ngIf="this.masterInfo.permissions.record_export"
        (click)="this.recordExport(item)"
        ngxTippy
        data-tippy-content="Record Export"
      >
        <i class="fa fa-download {{ store.fontsize === 'large' ? 'h-5.5 w-5.5' : store.fontsize === 'medium' ? 'h-4.5 w-4.5' : 'h-3.5 w-3.5' }}"></i>
      </a>

      <a
        href="javascript:void(0);"
        class="hover:text-primary"
        appDynamicFontSize="body"
        *ngIf="this.allowPasswordModal"
        (click)="this.passwordModal(item)"
        ngxTippy
        data-tippy-content="Reset Password"
      >
        <i class="fa fa-key {{ store.fontsize === 'large' ? 'h-5.5 w-5.5' : store.fontsize === 'medium' ? 'h-4.5 w-4.5' : 'h-3.5 w-3.5' }}"></i>
      </a>
    </div>
  </ng-template>

  <ng-template #statusTemplate let-item>
    <span
      class="badge"
      [ngClass]="[
        store.fontsize === 'large' ? 'text-base' : store.fontsize === 'medium' ? 'text-sm' : 'text-xs',
        item.status ? 'badge-outline-success' : 'badge-outline-danger'
      ]"
    >
      {{
        item.status == '1' ? ('table_status_val_0' | translate) : item.status == '2' ? ('table_status_val_1' | translate) : ('table_status_val_2' | translate)
      }}
    </span>
  </ng-template>
</div>

<app-loader *ngIf="loading"></app-loader>

<!-- Line Items Modal -->
<div class="fixed inset-0 z-50 overflow-y-auto" *ngIf="isItemModalOpen">
  <!-- Modal Backdrop -->
  <div class="fixed inset-0 bg-black/50 transition-opacity dark:bg-black/70"></div>

  <!-- Modal Panel -->
  <div class="flex min-h-screen items-center justify-center p-2 sm:p-4">
    <div
      class="relative w-full max-w-4xl transform overflow-hidden rounded-lg bg-white shadow-xl transition-all dark:border dark:border-gray-700 dark:bg-gray-800"
    >
      <!-- Modal Header -->
      <div class="border-b bg-gray-50 px-4 py-3 dark:border-gray-700 dark:bg-gray-900 sm:px-6">
        <div class="flex items-center justify-between">
          <h3 class="text-base font-medium text-gray-900 dark:text-gray-100 sm:text-lg">
            {{ 'title_reset_password' | translate }}
          </h3>
          <button
            type="button"
            class="rounded-md p-2 text-gray-400 hover:text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:hover:text-gray-100"
            (click)="cancelResetPwd()"
          >
            <span class="sr-only">Close</span>
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>

      <!-- Line Items Modal Content Section -->
      <div class="px-4 py-4 sm:px-6">
        <form
          [formGroup]="changePasswordForm"
          (ngSubmit)="onChangePassword()"
          class="mb-5 rounded-md border border-[#ebedf2] bg-white p-4 dark:border-[#191e3a] dark:bg-[#0e1726]"
        >
          <div class="flex flex-col sm:flex-row">
            <div class="grid flex-1 gap-5 sm:grid-cols-2">
              <div>
                <label for="new_password" class="form-label">{{ 'form_label_new_pwd' | translate }}</label>
                <input type="password" formControlName="new_password" class="form-input" id="new_password" />
                <div *ngIf="changePasswordForm.get('new_password')?.invalid && changePasswordForm.get('new_password')?.touched" class="text-red-500">
                  {{ 'form_label_confirm_new_pwd' | translate }}
                </div>
              </div>
              <div>
                <label for="confirm_new_password" class="form-label">{{ 'form_label_confirm_new_pwd' | translate }}</label>
                <input type="password" formControlName="confirm_new_password" class="form-input" id="confirm_new_password" />
                <div
                  *ngIf="changePasswordForm.get('confirm_new_password')?.invalid && changePasswordForm.get('confirm_new_password')?.touched"
                  class="text-red-500"
                >
                  {{ 'form_confirm_new_pwd_req_msg' | translate }}
                </div>
              </div>
              <div class="mt-3 sm:col-span-2">
                <button appDynamicFontSize="body" type="submit" class="btn btn-primary">{{ 'reset' | translate }}</button>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
