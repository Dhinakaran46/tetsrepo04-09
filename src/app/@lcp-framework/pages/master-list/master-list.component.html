<div>
  <app-datatable [masterInfo]="masterInfo" [enableCheckBox]="enableCheckBox" [customTemplates]="customTemplates"
    [headercolumns]="headercolumns" [selectcolumns]="selectcolumns" [items]="items" [totalItems]="totalItems"
    [currentPage]="currentPage" [resultsPerPage]="resultsPerPage" [column]="column" [title]="title" [query]="query"
    (delete)="deleteItems($event)" (edit)="editItem($event)" (view)="viewItem($event)"
    (customAction)="handleCustomAction($event)" (pageChange)="onPageChange($event)"
    (resultsPerPageChange)="onResultsPerPageChange($event)" (columnSort)="sortColumn($event)"
    (searchQuery)="searchData($event)" (exportType)="exportTable($event)"
    (advancedSearchQuery)="advancedSearchData($event)"></app-datatable>
  <ng-template #actionTemplate let-item>
    <div class="flex items-center gap-4">
      <a href="javascript:void(0);" class="hover:text-primary" *ngIf="this.masterInfo.permissions.details"
        (click)="this.viewItem(item)" ngxTippy data-tippy-content="Details" appDynamicFontSize="body">
        <i
          class="fa-regular fa-eye {{ store.fontsize === 'large' ? 'h-5.5 w-5.5' : store.fontsize === 'medium' ? 'h-4.5 w-4.5' : 'h-3.5 w-3.5' }}"></i>
      </a>
      <a href="javascript:void(0);" class="hover:text-info" appDynamicFontSize="body"
        *ngIf="this.masterInfo.permissions.edit" (click)="this.editItem(item)" ngxTippy data-tippy-content="Edit">
        <i
          class="fa-regular fa-pen-to-square {{ store.fontsize === 'large' ? 'h-5.5 w-5.5' : store.fontsize === 'medium' ? 'h-4.5 w-4.5' : 'h-3.5 w-3.5' }}"></i>
      </a>

      <a href="javascript:void(0);" class="hover:text-primary" appDynamicFontSize="body"
        *ngIf="this.masterInfo.permissions.delete" (click)="this.deleteItem(item)" ngxTippy data-tippy-content="Delete">
        <i
          class="fa-regular fa-trash-can {{ store.fontsize === 'large' ? 'h-5.5 w-5.5' : store.fontsize === 'medium' ? 'h-4.5 w-4.5' : 'h-3.5 w-3.5' }}"></i>
      </a>

      <a href="javascript:void(0);" class="hover:text-primary" appDynamicFontSize="body"
        *ngIf="this.masterInfo.permissions.assign" (click)="this.assignItem(item)" ngxTippy data-tippy-content="Assign">
        <i
          class="fa fa-tasks {{ store.fontsize === 'large' ? 'h-5.5 w-5.5' : store.fontsize === 'medium' ? 'h-4.5 w-4.5' : 'h-3.5 w-3.5' }}"></i>
      </a>
    </div>
  </ng-template>

  <ng-template #statusTemplate let-item>
    <span class="badge" [ngClass]="[
        store.fontsize === 'large' ? 'text-base' : store.fontsize === 'medium' ? 'text-sm' : 'text-xs',
        item.status ? 'badge-outline-success' : 'badge-outline-danger'
      ]">
      {{
      item.status == '1' ? ('table_status_val_0' | translate) : item.status ==
      '2' ? ('table_status_val_1' | translate) : ('table_status_val_2' |
      translate)
      }}
    </span>
  </ng-template>
</div>
