<div class="mx-auto max-w-3xl p-4">
  <h2 class="mb-6 text-center text-2xl font-semibold">Approval Process Tracker</h2>

  <div class="relative flex flex-col gap-1">
    <ng-container *ngFor="let step of approvalSteps; let last = last">
      <div class="flex">
        <div class="mr-6 flex flex-col items-center">
          <!-- Dot -->
          <div
            class="h-4 w-4 rounded-full border-2 border-white"
            [ngClass]="{
              'bg-green-500': step.review_status === 'approval_completed',
              'bg-yellow-400': step.review_status === 'approval_needed',
              'bg-gray-400': step.review_status === 'pending',
              'bg-red-400': step.review_status === 'approval_rejected',
              'bg-purple-400': step.review_status === 'void'
            }"
          ></div>

          <!-- Line below dot (only if not last) -->
          <div *ngIf="!last" class="my-1 w-0.5 flex-1 bg-gray-300"></div>
        </div>

        <!-- Content -->
        <div class="flex-1 space-y-1">
          <div class="flex flex-col gap-1 sm:flex-row sm:items-center sm:justify-between sm:gap-2">
            <p class="text-base font-medium">Approver: {{ step.approver }}</p>
            <div>
              <span
                class="inline-block rounded px-3 py-1 text-xs font-semibold"
                [ngClass]="{
                  'bg-green-100 text-green-800': step.review_status === 'approval_completed',
                  'bg-yellow-100 text-yellow-800': step.review_status === 'approval_needed',
                  'bg-gray-200 text-gray-800': step.review_status === 'pending',
                  'bg-red-100 text-red-800': step.review_status === 'approval_rejected',
                  'bg-purple-100 text-purple-800': step.review_status === 'void'
                }"
              >
                {{ step.review_status.replaceAll('_', ' ') }}
              </span>
            </div>
          </div>
          <p class="text-sm text-gray-600">Type: {{ step.approver_type }}</p>
          <p class="text-sm text-gray-500">Assigned At: {{ step.assigned_at || 'N/A' }}</p>
          <p class="text-sm text-gray-500">Processed At: {{ step.processed_at || 'Pending' }}</p>
        </div>
      </div>
    </ng-container>
  </div>
</div>
