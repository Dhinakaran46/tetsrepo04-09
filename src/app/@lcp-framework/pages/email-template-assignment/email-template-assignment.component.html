<div class="panel">
  <div class="mb-5 flex flex-col items-start justify-between gap-3 lg:flex-row lg:items-center">
    <h5 class="text-lg font-semibold dark:text-white-light">
      <!-- Email template assignment -->
      {{ 'email_template_assignment_form' | translate }}
    </h5>
    <div class="align-center flex gap-3">
      <button appDynamicFontSize="body" type="button" class="btn btn-danger mr-5 ltr:rounded-r rtl:rounded-l" (click)="location.back()">
        {{ 'back' | translate }}
      </button>
      <button type="submit" class="btn btn-outline-secondary ng-tns-c3247919129-2 text-xs ltr:rounded-r rtl:rounded-l" (click)="submit()">Submit</button>
    </div>
  </div>

  <div>
    <form [formGroup]="form">
      <div formGroupName="email_template_process" class="mb-5 flex flex-col items-start justify-between gap-3 lg:flex-row lg:items-center">
        <div class="min-w-200-p">
          <div class="form-group">
            <label for="email_template_process_id">{{ 'email_template_process' | translate }}</label>
            <select
              formControlName="email_template_process_id"
              class="form-select w-full py-1 text-xs text-gray-700 placeholder:text-white-dark dark:bg-gray-800 dark:text-white-dark"
              required
            >
              <option value="">Please select</option>
              @for(process of emailTemplateProcessDetail; track process; let i = $index) {
              <option [value]="process.id">{{ process.name }}</option>
              }
            </select>
          </div>
        </div>

        <button
          (click)="addEmailTemplateAssignment()"
          class="hover:bg-primary-dark dark:bg-primary-dark dark:focus:ring-primary-dark flex w-40 flex-row items-center justify-center gap-8 rounded-md bg-primary px-6 py-2 text-white shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 dark:text-white"
          type="button"
        >
          Add
        </button>
      </div>

      <div formArrayName="email_template_assignments">
        @for(assignment of getTemplateAssignmentList(); track assignment; let i = $index) {
        <div [formGroupName]="i" class="my-4">
          <div class="grid grid-cols-4 gap-3">
            <div class="form-group">
              <label>{{ 'recipient_type' | translate }}</label>
              <select
                formControlName="recipient_type"
                class="form-select w-full py-1 text-xs text-gray-700 placeholder:text-white-dark dark:bg-gray-800 dark:text-white-dark"
                required
              >
                <option value="tag">Tag</option>
                <option value="user_id">User</option>
                <option value="custom">Custom Mail</option>
              </select>
            </div>

            <div class="form-group" *ngIf="assignment.get('recipient_type')?.value === 'tag'">
              <label>{{ 'email_tag' | translate }}</label>
              <select
                formControlName="email_to"
                class="form-select w-full py-1 text-xs text-gray-700 placeholder:text-white-dark dark:bg-gray-800 dark:text-white-dark"
                required
              >
                @for(tag of recipientTags; track tag; let i = $index) {
                <option [value]="tag.id">{{ tag.name }}</option>
                }
              </select>
            </div>

            <div class="form-group" *ngIf="assignment.get('recipient_type')?.value === 'user_id'">
              <label>{{ 'user_email' | translate }}</label>
              <input
                type="text"
                class="form-control form-input w-full py-1 text-xs text-gray-600 placeholder:text-white-dark"
                formControlName="email_to"
                placeholder="Search user email"
                required
              />
            </div>

            <div class="form-group" *ngIf="assignment.get('recipient_type')?.value === 'custom'">
              <label>{{ 'email' | translate }}</label>
              <input
                type="email"
                class="form-control form-input w-full py-1 text-xs text-gray-600 placeholder:text-white-dark"
                formControlName="email_to"
                placeholder="Enter email address"
                required
              />
            </div>

            <div class="form-group">
              <label>{{ 'email_template' | translate }}</label>
              <select
                formControlName="template_id"
                class="form-select w-full py-1 text-xs text-gray-700 placeholder:text-white-dark dark:bg-gray-800 dark:text-white-dark"
                required
              >
                @for(template of templateList; track template; let i = $index) {
                <option [value]="template.value">{{ template.label }}</option>
                }
              </select>
            </div>

            @if(i > 0) {
            <button
              appDynamicFontSize="body"
              type="button"
              class="hover:bg-danger-dark dark:bg-danger-dark dark:focus:ring-danger-dark w-25 mt-5 flex flex-row items-center justify-center gap-8 rounded-md bg-danger px-6 py-2 text-white shadow-sm focus:outline-none focus:ring-2 focus:ring-danger focus:ring-offset-2 dark:text-white"
              (click)="removeEmailTemplateAssignment(i)"
            >
              {{ 'remove_recipient' | translate }}
            </button>
            }
          </div>

          <div formArrayName="cc_bcc" class="grid grid-cols-1">
            @for(ccBcc of getCcBccControls(i); track ccBcc; let j = $index) {
            <div [formGroupName]="j" class="mt-4 grid grid-cols-4 gap-3">
              <div class="form-group">
                <label>{{ 'send_type' | translate }}</label>
                <select
                  formControlName="send_type"
                  class="form-select w-full py-1 text-xs text-gray-700 placeholder:text-white-dark dark:bg-gray-800 dark:text-white-dark"
                  required
                >
                  <option value="cc">CC</option>
                  <option value="bcc">BCC</option>
                </select>
              </div>

              <div class="form-group">
                <label>{{ 'recipient_type' | translate }}</label>
                <select
                  formControlName="recipient_type"
                  class="form-select w-full py-1 text-xs text-gray-700 placeholder:text-white-dark dark:bg-gray-800 dark:text-white-dark"
                  required
                >
                  <option value="tag">Tag</option>
                  <option value="user_id">User</option>
                  <option value="custom">Custom Mail</option>
                </select>
              </div>

              <div class="form-group" *ngIf="ccBcc.get('recipient_type')?.value === 'tag'">
                <label>{{ 'email_tag' | translate }}</label>
                <select
                  formControlName="email_to"
                  class="form-select w-full py-1 text-xs text-gray-700 placeholder:text-white-dark dark:bg-gray-800 dark:text-white-dark"
                  required
                >
                  @for(tag of recipientTags; track tag; let i = $index) {
                  <option [value]="tag.id">{{ tag.name }}</option>
                  }
                </select>
              </div>

              <div class="form-group" *ngIf="ccBcc.get('recipient_type')?.value === 'user_id'">
                <label>{{ 'user_email' | translate }}</label>
                <input
                  type="text"
                  class="form-control form-input w-full py-1 text-xs text-gray-600 placeholder:text-white-dark"
                  formControlName="email_to"
                  placeholder="Search user email"
                  required
                />
              </div>

              <div class="form-group" *ngIf="ccBcc.get('recipient_type')?.value === 'custom'">
                <label>{{ 'email' | translate }}</label>
                <input
                  type="email"
                  class="form-control form-input w-full py-1 text-xs text-gray-600 placeholder:text-white-dark"
                  formControlName="email_to"
                  placeholder="Enter email address"
                  required
                />
              </div>

              <button
                type="button"
                class="hover:bg-danger-dark dark:bg-danger-dark dark:focus:ring-danger-dark mt-5 flex w-20 flex-row items-center justify-center gap-8 rounded-md bg-danger px-6 py-2 text-white shadow-sm focus:outline-none focus:ring-2 focus:ring-danger focus:ring-offset-2 dark:text-white"
                (click)="removeCcBccGroup(i, j)"
              >
                {{ 'remove' | translate }}
              </button>
            </div>
            }
          </div>
          <button
            type="button"
            class="hover:bg-primary-dark dark:bg-primary-dark dark:focus:ring-primary-dark mt-5 flex flex-row items-center justify-center gap-8 rounded-md bg-primary px-6 py-2 text-white shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 dark:text-white"
            (click)="addCcBccGroup(i)"
          >
            {{ 'add_cc_bcc' | translate }}
          </button>
        </div>
        }
      </div>
    </form>
  </div>
</div>
