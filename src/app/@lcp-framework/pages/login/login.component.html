<div style="height: 100%" class="login-app">
  <div class="absolute inset-0">
    <img src="assets/images/auth/bg-gradient.png" alt="image"
      class="h-full w-full object-cover" />
  </div>
  <div
    style="height: 100%"
    class="relative flex flex-col min-h-96 items-center justify-center bg-[url(../../assets/images/auth/map.png)] bg-cover bg-center bg-no-repeat px-6 py-10 dark:bg-[#060818] sm:px-16">
    <img src="assets/images/auth/coming-soon-object1.png" alt="image"
      class="absolute left-0 top-1/2 h-full max-h-[893px] -translate-y-1/2" />
    <img src="assets/images/auth/coming-soon-object3.png" alt="image"
      class="absolute right-0 top-0 h-[300px]" />
    <div
      class="relative w-full max-w-[1502px] justify-center overflow-hidden rounded-md bg-white/60 backdrop-blur-lg dark:bg-black/50 lg:min-h-[100%] lg:flex-row lg:gap-10 xl:gap-0">
      <div class="flex items-center justify-between w-full p-4 px-6 mt-3">
        <!-- Left Side: Logo -->
        <div class="flex-shrink-0">
          <img src="assets/images/logo.png" alt="Logo">
        </div>
        <!-- Right Side: Full-width Dropdown -->
        <div class="w-full max-w-md">
          <div class="dropdown ms-auto w-max">
            <div hlMenu>
              <button
                type="button"
                hlMenuButton
                class="flex items-center gap-2.5 rounded-lg border border-white-dark/30 bg-white px-2 py-1.5 text-white-dark hover:border-primary hover:text-primary dark:bg-black">
                <div>
                  <img
                    [src]="'assets/images/flags/' + store.locale.toUpperCase() + '.svg'"
                    alt="image" class="h-5 w-5 rounded-full object-cover" />
                </div>
                <div class="text-base font-bold uppercase">{{ store.locale
                  }}</div>
                <span class="shrink-0">
                  <i class="fa-solid fa-angle-down"></i>
                </span>
              </button>
              <ul
                *hlMenuItems
                @toggleAnimation
                class="top-11 grid w-[280px] grid-cols-2 gap-2 !px-2 font-semibold text-dark dark:text-white-dark dark:text-white-light/90 ltr:-right-14 sm:ltr:-right-2 rtl:-left-14 sm:rtl:-left-2">
                <li *ngFor="let item of store.languageList">
                  <button
                    *hlMenuItem="let menuItem"
                    type="button"
                    class="w-full hover:text-primary"
                    [ngClass]="{ 'bg-primary/10 text-primary': translate.currentLang === item.code }"
                    (click)="changeLanguage(item)">
                    <img class="h-5 w-5 rounded-full object-cover"
                      [src]="'assets/images/flags/' + item.code.toUpperCase() + '.svg'"
                      alt />
                    <span class="ltr:ml-3 rtl:mr-3">{{ item.name }}</span>
                  </button>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
      <div
        class="relative flex w-full flex-col items-center justify-center gap-6 px-4 pb-16 pt-6 sm:px-6">
        <div
          class="flex w-full max-w-[440px] items-center gap-2 lg:absolute lg:end-6 lg:top-6 lg:max-w-full">
          <a routerLink="/" class="block w-8 lg:hidden">
            <img src="assets/images/logo.png" alt="Logo" class="mx-auto w-10" />
          </a>

        </div>
        <div class="w-full max-w-[440px] lg:mt-12">
          <div class="mb-10">
            <h1
              class="text-3xl font-extrabold uppercase !leading-snug text-primary md:text-4xl">{{
              this.title_key | translate }}</h1>
          </div>
          <form class="space-y-5 dark:text-white" [formGroup]="loginForm"
            (ngSubmit)="onSubmit()" autocomplete="off">
            <div>
              <label for="Email">{{ 'form_label_email' | translate }}</label>
              <div class="relative text-white-dark">
                <input
                  formControlName="email"
                  id="Email"
                  type="email"
                  placeholder="{{ 'form_label_email_placeholder' | translate}}"
                  class="form-input ps-10 placeholder:text-white-dark"
                  [class.is-invalid]="isSubmitted && loginForm.controls['email'].invalid" />
                <span class="absolute start-4 top-1/2 -translate-y-1/2">
                  <i class="fa-solid fa-envelope"></i>
                </span>
              </div>
              <div
                *ngIf="isSubmitted && loginForm.controls['email'].hasError('pattern')"
                class="text-danger">
                {{ 'form_email_valid_msg' | translate }}
              </div>

              <div
                *ngIf="isSubmitted && loginForm.controls['email'].hasError('required')"
                class="text-danger">
                {{ 'form_email_req_msg' | translate }}
              </div>
              <div
                *ngIf="isSubmitted && loginForm.controls['email'].hasError('email')"
                class="text-danger">{{ 'form_email_valid_msg' | translate
                }}</div>
            </div>
            <div>
              <label for="Password">{{ 'form_label_password' | translate
                }}</label>
              <div class="relative text-white-dark">
                <input
                  autocomplete="new-password"
                  formControlName="password"
                  id="Password"
                  [type]="passwordVisible ? 'text' : 'password'"
                  placeholder="{{ 'form_label_password_placeholder' | translate }}"
                  class="form-input ps-10 placeholder:text-white-dark"
                  [class.is-invalid]="isSubmitted && loginForm.controls['password'].invalid" />
                <span class="absolute start-4 top-1/2 -translate-y-1/2">
                  <i class="fa-solid fa-unlock-keyhole"></i>
                </span>
                <span
                  class="absolute end-4 top-1/2 -translate-y-1/2 cursor-pointer"
                  (click)="togglePasswordVisibility(); toggleIcon()"
                  [ngClass]="{ 'text-dark': iconClicked, 'text-light': !iconClicked }">
                  <i class="fa-regular fa-eye"></i> </span>
              </div>
              <div *ngIf="isSubmitted && passwordControl?.invalid"
                class="text-danger">{{ 'form_email_req_pwd' | translate
                }}</div>
            </div>
            <div class="flex items-center justify-between">
              <label class="flex cursor-pointer items-center">
                <input formControlName="subscribe" type="checkbox"
                  class="form-checkbox bg-white dark:bg-black" />
                <span class="text-white-dark">{{ 'form_remember_me' |
                  translate }}</span>
              </label>
              <a routerLink="/forget-password"
                class="text-white-dark hover:text-blue-500">
                {{ 'forget_pwd' | translate }}
              </a>
            </div>

            <button type="submit"
              class="btn btn-gradient !mt-6 w-full border-0 uppercase shadow-[0_10px_20px_-10px_rgba(67,97,238,0.44)]">
              {{ 'submit' | translate }}
            </button>
          </form>
        </div>
        <app-copyright
          class="absolute bottom-10 w-full text-center dark:text-white"></app-copyright>
      </div>
    </div>
  </div>
</div>

<app-loader *ngIf="loading"></app-loader>
