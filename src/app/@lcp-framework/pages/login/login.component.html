<div class="mb-10">
  <h1 class="text-3xl font-extrabold uppercase !leading-snug text-primary md:text-4xl">{{ this.title_key | translate }}</h1>
</div>
<form class="space-y-5 dark:text-white" [formGroup]="loginForm" (ngSubmit)="onSubmit()" autocomplete="off">
  <div>
    <label for="Email">{{ 'form_label_email' | translate }}</label>
    <div class="relative text-white-dark">
      <input
        formControlName="email"
        id="Email"
        type="email"
        placeholder="{{ 'form_label_email_placeholder' | translate }}"
        class="form-input ps-10 placeholder:text-white-dark"
        [class.is-invalid]="isSubmitted && loginForm.controls['email'].invalid"
      />
      <span class="absolute start-4 top-1/2 -translate-y-1/2">
        <i class="fa-solid fa-envelope"></i>
      </span>
    </div>
    <div *ngIf="isSubmitted && loginForm.controls['email'].hasError('pattern')" class="text-danger">
      {{ 'form_email_valid_msg' | translate }}
    </div>

    <div *ngIf="isSubmitted && loginForm.controls['email'].hasError('required')" class="text-danger">
      {{ 'form_email_req_msg' | translate }}
    </div>
    <div *ngIf="isSubmitted && loginForm.controls['email'].hasError('email')" class="text-danger">{{ 'form_email_valid_msg' | translate }}</div>
  </div>
  <div>
    <label for="Password">{{ 'form_label_password' | translate }}</label>
    <div class="relative text-white-dark">
      <input
        autocomplete="new-password"
        formControlName="password"
        id="Password"
        [type]="passwordVisible ? 'text' : 'password'"
        placeholder="{{ 'form_label_password_placeholder' | translate }}"
        class="form-input ps-10 placeholder:text-white-dark"
        [class.is-invalid]="isSubmitted && loginForm.controls['password'].invalid"
      />
      <span class="absolute start-4 top-1/2 -translate-y-1/2">
        <i class="fa-solid fa-unlock-keyhole"></i>
      </span>
      <span
        class="absolute end-4 top-1/2 -translate-y-1/2 cursor-pointer"
        (click)="togglePasswordVisibility(); toggleIcon()"
        [ngClass]="{ 'text-dark': iconClicked, 'text-light': !iconClicked }"
      >
        <i class="fa-regular fa-eye"></i>
      </span>
    </div>
    <div *ngIf="isSubmitted && passwordControl?.invalid" class="text-danger">{{ 'form_email_req_pwd' | translate }}</div>
  </div>
  <div class="flex items-center justify-between">
    <label class="flex cursor-pointer items-center">
      <input formControlName="subscribe" type="checkbox" class="form-checkbox bg-white dark:bg-black" />
      <span class="text-white-dark">{{ 'form_remember_me' | translate }}</span>
    </label>
    <a routerLink="/forget-password" class="text-white-dark hover:text-blue-500">
      {{ 'forget_pwd' | translate }}
    </a>
  </div>

  <button type="submit" class="btn btn-gradient !mt-6 w-full border-0 uppercase shadow-[0_10px_20px_-10px_rgba(67,97,238,0.44)]">
    {{ 'submit' | translate }}
  </button>
</form>

<app-loader *ngIf="loading"></app-loader>
